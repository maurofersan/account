<div class="select-account-page">
  <div class="select-account-page__container">
    <app-account-navigation
      [backButtonText]="getText('account.common.backButton')"
      (backClick)="goBack()"
    ></app-account-navigation>

    <app-account-title-section
      [titlePrefix]="getText('account.select-account.title.prefix')"
      [titleHighlight]="getText('account.select-account.title.highlight')"
      [subtitle]="getText('account.select-account.subtitle')"
    ></app-account-title-section>

    <div class="select-account-page__accounts">
      @for (account of accounts; track account.id; let idx = $index) {
      <div class="select-account-page__accounts__item">
        <app-account-card
          [account]="account"
          [isSelected]="selectedAccount?.id === account.id"
          (selectAccount)="onAccountSelect($event)"
        ></app-account-card>
      </div>
      }
    </div>

    <div class="select-account-page__currency">
      <h3 class="select-account-page__currency__title">
        {{ getText('account.select-account.currencyQuestion') }}
      </h3>
      <app-currency-selector
        [currencies]="currencies"
        [selectedCurrency]="selectedCurrency"
        (currencyChange)="onCurrencySelect($event)"
      ></app-currency-selector>
    </div>

    <div class="select-account-page__actions">
      <std-button
        appStdButton
        class="select-account-page__continue-btn"
        [class.select-account-page__continue-btn--disabled]="!canContinue"
        [disabled]="!canContinue"
        (click)="continue()"
      >
        {{ getText('account.select-account.continueButton') }}
      </std-button>
    </div>

    <!-- Sección de información adicional -->
    <div class="select-account-page__additional-info">
      <!-- Pastillas informativas -->
      <div class="select-account-page__info-badges">
        <div class="select-account-page__info-badge select-account-page__info-badge--trea">
          <img 
            [src]="'assets/images/Pastilla.CtaLibre.svg' | prefixAsset" 
            alt="TE RINDE TREA" 
            class="select-account-page__info-badge__icon"
            (error)="onImageError($event)"
          />
          <span class="select-account-page__info-badge__text">TE RINDE TREA</span>
        </div>
        
        <div class="select-account-page__info-badge select-account-page__info-badge--percentage">
          <span class="select-account-page__info-badge__label">TREA</span>
          <span class="select-account-page__info-badge__value">0.00%</span>
        </div>
        
        <div class="select-account-page__info-badge select-account-page__info-badge--compromiso">
          <img 
            [src]="'assets/images/SelloCompromiso.svg' | prefixAsset" 
            alt="COMPROMISO" 
            class="select-account-page__info-badge__icon"
            (error)="onImageError($event)"
          />
          <div class="select-account-page__info-badge__content">
            <span class="select-account-page__info-badge__text">COMPROMISO</span>
            <span class="select-account-page__info-badge__subtext">Hablemos más simple</span>
          </div>
        </div>
      </div>

      <!-- Información legal y financiera -->
      <div class="select-account-page__legal-info">
        <p class="select-account-page__legal-text">
          {{ getText('account.select-account.legalInfo') }}
        </p>
      </div>
    </div>
  </div>
</div>
